[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socf"
version = "0.1.0"
description = "Self-Optimizing Control Framework in Pyomo"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Saket P. Dhake" },
]
dependencies = [
  "numpy",
  "pandas",
  "pyomo",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
